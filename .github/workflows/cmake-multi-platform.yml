name: C/C++ CI

on:
  push:
    branches: [ "main", "meson_migration" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    #runs-on: ubuntu-latest

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest]


    steps:
    - uses: actions/checkout@v4
    #- run: sudo apt-get -y install yodl build-essential
    - if: runner.os == 'macOS'
      run: |
        brew install ncurses pcre2 autoconf gdbm meson ninja

    - name: configure
      run: |
        meson setup builddir
        # ./configure --enable-zsh-debug --enable-zsh-mem-debug --enable-zsh-mem-warning --enable-zsh-secure-free --enable-zsh-heap-debug --enable-zsh-hash-debug --enable-pcre --enable-cap --enable-gdbm --enable-multibyte
        cat builddir/config.h
    - name: make
      run: script -q /dev/null sh -c "meson compile -C builddir --interactive"
    - name: test
      run: TERM=xterm meson test -C builddir/
    # - name: make check
    #   run: TERM=xterm make check
